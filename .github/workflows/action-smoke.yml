name: Action smoke test

on:
  push:
    branches: [main]
    paths:
      - action.yml
      - scripts/action-run.sh
      - spec/fixtures/action/basic.bk.rb
      - .github/workflows/action-smoke.yml
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./ # zizmor: ignore[self-repository] actionlint rejects $/ for root actions
        with:
          path: spec/fixtures/action/basic.bk.rb
