name: Action smoke test

on:
  push:
    branches: [main]
    paths:
      - action.yml
      - scripts/action-run.sh
      - breadkit-lint.gemspec
      - Gemfile
      - Gemfile.lock
      - lib/**
      - spec/fixtures/action/basic.bk.rb
      - spec/fixtures/action/rated_output.bk.rb
      - .github/workflows/action-smoke.yml
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install PNG renderer
        run: sudo apt-get update && sudo apt-get install -y librsvg2-bin
      - uses: ./ # zizmor: ignore[self-repository] actionlint rejects $/ for root actions
        with:
          path: spec/fixtures/action/basic.bk.rb
      - id: rated_output
        uses: ./ # zizmor: ignore[self-repository] actionlint rejects $/ for root actions
        continue-on-error: true
        with:
          path: spec/fixtures/action/rated_output.bk.rb
          upload-sarif: "false"
      - name: Check rated output finding
        env:
          RESULT: ${{ steps.rated_output.outcome }}
        run: test "$RESULT" = failure
      - id: annotated
        uses: ./ # zizmor: ignore[self-repository] actionlint rejects $/ for root actions
        with:
          path: spec/fixtures/action/basic.bk.rb
          upload-sarif: "false"
          annotated-image: "true"
      - name: Check annotated PNG
        env:
          IMAGE: ${{ steps.annotated.outputs.image-file }}
        run: |
          test -s "$IMAGE"
          test "$(file -b --mime-type "$IMAGE")" = image/png
