Layout/InvalidHole:
  offense: |
    board :half
    wire 'a999', 'a1'
  no_offense: |
    board :half
    wire 'a2', 'a1'
Layout/UnknownBoard:
  offense: |
    board :missing_board
  no_offense: |
    board :half
Layout/UnknownPart:
  offense: |
    board :half
    part :U1, :missing_part, pins: %w[a1 a2]
  no_offense: |
    board :half
    resistor :R1, '330', pins: %w[a1 a2]
Layout/UnknownTransistorModel:
  offense: |
    board :mini
    transistor :Q1, 'unknown_123', pins: %w[a1 a2 a3]
  no_offense: |
    board :mini
    transistor :Q1, 'BC547', pins: %w[a1 a2 a3]
Layout/UnknownPin:
  offense: |
    board :half
    resistor :R1, '330', pins: %w[a1 a2]
    wire 'R1.BAD', 'a3'
  no_offense: |
    board :half
    resistor :R1, '330', pins: %w[a1 a2]
    wire 'R1.1', 'a3'
Layout/UnknownOption:
  offense: |
    board :half
    resistor :R1, '330', pins: %w[a1 a2], not_a_real_option: true
  no_offense: |
    board :half
    resistor :R1, '330', pins: %w[a1 a2]
Layout/InvalidOption:
  offense: |
    board :half
    resistor :R1, '330', pins: %w[a1 a2], bands: 6
  no_offense: |
    board :half
    resistor :R1, '330', pins: %w[a1 a2], bands: 5
Layout/InvalidValue:
  offense: |
    board :half
    resistor :R1, '33O', pins: %w[a1 a2]
  no_offense: |
    board :half
    resistor :R1, '330', pins: %w[a1 a2]
Layout/InvalidColor:
  offense: |
    board :half
    wire 'a1', 'a2', color: :rde
  no_offense: |
    board :half
    wire 'a1', 'a2', color: :red
Layout/InvalidRoute:
  offense: |
    board :half
    wire 'a1', 'a2', route: :curvy
  no_offense: |
    board :half
    wire 'a1', 'a2', route: :straight
Layout/InvalidWireId:
  offense: |
    board :half
    wire 'a1', 'a2', id: 'a20'
  no_offense: |
    board :half
    wire 'a1', 'a2', id: 'W20'
Layout/UnmatchedParts:
  offense: |
    board :half
    use_parts 'no-such-parts/*.yml'
  no_offense: |
    board :half
Layout/PartOverride:
  offense: |
    board :half
    File.write(File.join(__dir__, 'replacement.yml'), "id: led\noverride: true\ncategory: diode\nplacement: leads\npins:\n  - {num: 1, name: anode}\n  - {num: 2, name: cathode}\n")
    use_parts File.join(__dir__, 'replacement.yml')
  no_offense: |
    board :half
Lint/RedundantDisable:
  offense: |
    board :half
    lint_disable 'Lint/RedundantDisable'
  no_offense: |
    board :half
Lint/UnknownRuleInDisable:
  offense: |
    board :half
    lint_disable 'Missing/Rule'
  no_offense: |
    board :half
    lint_disable 'Electrical/FloatingPin'
Layout/UnplacedPin:
  offense: |
    board :half
    resistor :R1, '330', pins: %w[a1]
  no_offense: |
    board :half
    resistor :R1, '330', pins: %w[a1 a2]
Layout/DuplicateRef:
  offense: |
    board :half
    resistor :R1, '330', pins: %w[a1 a2]
    resistor :R1, '220', pins: %w[a3 a4]
  no_offense: |
    board :half
    resistor :R1, '330', pins: %w[a1 a2]
    resistor :R2, '220', pins: %w[a3 a4]
Layout/InvalidPlacement:
  offense: |
    board :half
    ic :U1, 'NE555', at: 'a20'
  no_offense: |
    board :half
    ic :U1, 'NE555', at: 'e20'
Layout/HoleConflict:
  offense: |
    board :half
    resistor :R1, '330', pins: %w[a1 a2]
    resistor :R2, '220', pins: %w[a1 a3]
  no_offense: |
    board :half
    resistor :R1, '330', pins: %w[a1 a2]
    resistor :R2, '220', pins: %w[a3 a4]
Layout/NoFreeHole:
  offense: |
    board :half
    resistor :R1, '330', pins: %w[a1 a2]
    wire 'b1', 'g3'
    wire 'c1', 'g4'
    wire 'd1', 'g5'
    wire 'e1', 'g6'
    wire 'R1.1', 'g7'
  no_offense: |
    board :half
    resistor :R1, '330', pins: %w[a1 a2]
    wire 'b1', 'g3'
    wire 'c1', 'g4'
    wire 'd1', 'g5'
    wire 'R1.1', 'g7'
Layout/SplitNetLabel:
  offense: |
    board :half
    net :SIGNAL, at: 'a1'
    net :SIGNAL, at: 'a2'
  no_offense: |
    board :half
    net :SIGNAL, at: 'a1'
    net :SIGNAL, at: 'b1'
Layout/PinsInSameStrip:
  offense: |
    board :half
    resistor :R1, '330', pins: %w[a1 b1]
  no_offense: |
    board :half
    resistor :R1, '330', pins: %w[a1 a2]
Electrical/ShortCircuit:
  offense: |
    board :half
    supply :P, voltage: 5, plus: 'B+1', minus: 'B-1'
    wire 'B+2', 'B-2'
  no_offense: |
    board :half
    supply :P, voltage: 5, plus: 'B+1', minus: 'B-1'
Electrical/ShortedComponent:
  offense: |
    board :mini
    resistor :R1, '330', pins: %w[a1 a2]
    wire 'b1', 'b2'
  no_offense: |
    board :mini
    resistor :R1, '330', pins: %w[a1 a2]
Electrical/FloatingPin:
  offense: |
    board :half
    led :D1, anode: 'a10', cathode: 'a11'
  no_offense: |
    board :half
    supply :P, voltage: 5, plus: 'B+1', minus: 'B-1'
    led :D1, anode: 'a10', cathode: 'a11'
    wire 'b10', 'B+2'
    wire 'b11', 'B-2'
Electrical/DanglingWire:
  offense: |
    board :half
    wire 'a1', 'a2'
  no_offense: |
    board :half
    resistor :R1, '330', pins: %w[a1 a2]
    wire 'b1', 'b2'
Electrical/SplitRail:
  offense: |
    board :full, split_rails: true
    supply :P, voltage: 5, plus: 'B+1', minus: 'B-1'
    wire 'a10', 'B+30'
  no_offense: |
    board :full, split_rails: true
    supply :P, voltage: 5, plus: 'B+1', minus: 'B-1'
    wire 'a10', 'B+30'
    wire 'B+2', 'B+31'
Electrical/MissingSeriesResistor:
  offense: |
    board :half
    supply :P, voltage: 5, plus: 'B+1', minus: 'B-1'
    led :D1, anode: 'b10', cathode: 'g12'
    wire 'a10', 'B+2'
    wire 'h12', 'B-2'
  no_offense: |
    board :half
    supply :P, voltage: 5, plus: 'B+1', minus: 'B-1'
    led :D1, anode: 'b10', cathode: 'g12'
    resistor :R1, '330', pins: %w[a9 a10]
    wire 'b9', 'B+2'
    wire 'h12', 'B-2'
Electrical/MinimumResistance:
  offense: |
    board :half
    supply :P, voltage: 5, plus: 'B+1', minus: 'B-1'
    pot :VR1, '10k', at: 'a5'
    led :D1, anode: 'a10', cathode: 'a11'
    wire 'b5', 'B+'
    wire 'b6', 'b10'
    wire 'b11', 'B-'
  no_offense: |
    board :half
    supply :P, voltage: 5, plus: 'B+1', minus: 'B-1'
    pot :VR1, '10k', at: 'a5'
    resistor :R1, '330', pins: %w[a8 a9]
    led :D1, anode: 'a10', cathode: 'a11'
    wire 'b5', 'B+'
    wire 'b6', 'b8'
    wire 'b9', 'b10'
    wire 'b11', 'B-'
Electrical/ReversePolarity:
  offense: |
    board :half
    supply :P, voltage: 5, plus: 'B+1', minus: 'B-1'
    led :D1, anode: 'b10', cathode: 'g12'
    wire 'a10', 'B-2'
    wire 'h12', 'B+2'
  no_offense: |
    board :half
    supply :P, voltage: 5, plus: 'B+1', minus: 'B-1'
    led :D1, anode: 'b10', cathode: 'g12'
    wire 'a10', 'B+2'
    wire 'h12', 'B-2'
Electrical/PowerPinUnconnected:
  offense: |
    board :half
    supply :P, voltage: 5, plus: 'B+1', minus: 'B-1'
    ic :U1, 'NE555', at: 'e20'
  no_offense: |
    board :half
    supply :P, voltage: 5, plus: 'B+1', minus: 'B-1'
    ic :U1, 'NE555', at: 'e20'
    wire 'U1.8', 'B+2'
    wire 'U1.1', 'B-2'
Electrical/SupplyVoltageRange:
  offense: |
    board :half
    supply :P, voltage: 3.3, plus: 'B+1', minus: 'B-1'
    ic :U1, 'NE555', at: 'e20'
    wire 'U1.8', 'B+2'
    wire 'U1.1', 'B-2'
  no_offense: |
    board :half
    supply :P, voltage: 5, plus: 'B+1', minus: 'B-1'
    ic :U1, 'NE555', at: 'e20'
    wire 'U1.8', 'B+2'
    wire 'U1.1', 'B-2'
Electrical/NoCommonGround:
  offense: |
    board :half
    supply :P1, voltage: 5, plus: 'B+1', minus: 'B-1'
    supply :P2, voltage: 3.3, plus: 'T+1', minus: 'T-1'
  no_offense: |
    board :half
    supply :P1, voltage: 5, plus: 'B+1', minus: 'B-1'
    supply :P2, voltage: 3.3, plus: 'T+1', minus: 'B-2'
Electrical/NetLabelConflict:
  offense: |
    board :half
    net :A, at: 'a1'
    net :B, at: 'b1'
  no_offense: |
    board :half
    net :A, at: 'a1'
    net :B, at: 'a2'
Electrical/VoltageDomainMismatch:
  offense: |
    board :half
    File.write(File.join(__dir__, 'signal.yml'), "id: signal\nplacement: offboard\npins:\n  - {num: 1, name: GND, role: ground}\n  - {num: 2, name: SIG, role: gpio, max_voltage: 3.3}\n")
    use_parts File.join(__dir__, 'signal.yml')
    offboard :U, :signal
    supply :P, voltage: 5, plus: 'B+1', minus: 'B-1'
    wire 'U.GND', 'B-'
    wire 'U.SIG', 'B+'
  no_offense: |
    board :half
    File.write(File.join(__dir__, 'signal.yml'), "id: signal\nplacement: offboard\npins:\n  - {num: 1, name: GND, role: ground}\n  - {num: 2, name: SIG, role: gpio, max_voltage: 3.3}\n")
    use_parts File.join(__dir__, 'signal.yml')
    offboard :U, :signal
    supply :P, voltage: 3.3, plus: 'B+1', minus: 'B-1'
    wire 'U.GND', 'B-'
    wire 'U.SIG', 'B+'
Electrical/ResistorPowerRating:
  offense: |
    board :half
    supply :P, voltage: 5, plus: 'B+1', minus: 'B-1'
    resistor :R1, '10 1/4W', pins: %w[a10 a11]
    wire 'b10', 'B+'
    wire 'b11', 'B-'
  no_offense: |
    board :half
    supply :P, voltage: 5, plus: 'B+1', minus: 'B-1'
    resistor :R1, '330 1/4W', pins: %w[a10 a11]
    wire 'b10', 'B+'
    wire 'b11', 'B-'
Electrical/CapacitorVoltageRating:
  offense: |
    board :half
    supply :P, voltage: 5, plus: 'B+1', minus: 'B-1'
    electrolytic :C1, '10u 3V', plus: 'a10', minus: 'a11'
    wire 'b10', 'B+'
    wire 'b11', 'B-'
  no_offense: |
    board :half
    supply :P, voltage: 5, plus: 'B+1', minus: 'B-1'
    electrolytic :C1, '10u 16V', plus: 'a10', minus: 'a11'
    wire 'b10', 'B+'
    wire 'b11', 'B-'
Electrical/LedOvercurrent:
  offense: |
    board :half
    File.write(File.join(__dir__, 'rated_led.yml'), <<~YAML)
      id: led
      override: true
      category: diode
      placement: leads
      max_forward_current: 0.02
      pins:
        - {num: 1, name: anode}
        - {num: 2, name: cathode}
      polarity: {positive: anode, negative: cathode}
    YAML
    use_parts File.join(__dir__, 'rated_led.yml')
    supply :P, voltage: 5, plus: 'B+1', minus: 'B-1'
    resistor :R1, '10', pins: %w[a10 a12]
    led :D1, anode: 'b12', cathode: 'a14'
    wire 'b10', 'B+'
    wire 'b14', 'B-'
  no_offense: |
    board :half
    File.write(File.join(__dir__, 'rated_led.yml'), <<~YAML)
      id: led
      override: true
      category: diode
      placement: leads
      max_forward_current: 0.02
      pins:
        - {num: 1, name: anode}
        - {num: 2, name: cathode}
      polarity: {positive: anode, negative: cathode}
    YAML
    use_parts File.join(__dir__, 'rated_led.yml')
    supply :P, voltage: 5, plus: 'B+1', minus: 'B-1'
    resistor :R1, '330', pins: %w[a10 a12]
    led :D1, anode: 'b12', cathode: 'a14'
    wire 'b10', 'B+'
    wire 'b14', 'B-'
Electrical/I2CAddressConflict:
  offense: |
    board :half
    File.write(File.join(__dir__, 'sensor.yml'), "id: sensor\nplacement: offboard\npins:\n  - {num: 1, name: SDA, role: data}\n  - {num: 2, name: SCL, role: clock}\n")
    use_parts File.join(__dir__, 'sensor.yml')
    offboard :A, :sensor, address: '0x44'
    offboard :B, :sensor, address: '0x44'
    wire 'A.SDA', 'B.SDA'
    wire 'A.SCL', 'B.SCL'
  no_offense: |
    board :half
    File.write(File.join(__dir__, 'sensor.yml'), "id: sensor\nplacement: offboard\npins:\n  - {num: 1, name: SDA, role: data}\n  - {num: 2, name: SCL, role: clock}\n")
    use_parts File.join(__dir__, 'sensor.yml')
    offboard :A, :sensor, address: '0x44'
    offboard :B, :sensor, address: '0x45'
    wire 'A.SDA', 'B.SDA'
    wire 'A.SCL', 'B.SCL'
Electrical/SupplyOverload:
  offense: |
    board :mini
    supply :BAT, voltage: 5, plus: 'b1', minus: 'b5', current_limit: 0.003
    resistor :R1, '1k', pins: %w[a1 a5]
  no_offense: |
    board :mini
    supply :BAT, voltage: 5, plus: 'b1', minus: 'b5', current_limit: 0.01
    resistor :R1, '1k', pins: %w[a1 a5]
Intent/ConnectionMismatch:
  offense: |
    board :half
    resistor :R1, '330', pins: %w[a1 a2]
    expect { connected 'R1.1', 'R1.2' }
  no_offense: |
    board :half
    resistor :R1, '330', pins: %w[a1 a2]
    wire 'b1', 'b2'
    expect { connected 'R1.1', 'R1.2' }
Intent/UnknownNet:
  offense: |
    board :half
    expect { connected :MISSING, :ALSO_MISSING }
  no_offense: |
    board :half
    resistor :R1, '330', pins: %w[a1 a2]
    expect { connected 'R1.1', 'R1.1' }
Intent/MeasurementUnavailable:
  offense: |
    board :half
    offboard :UNO, :arduino_uno
    resistor :R1, '330', pins: %w[a10 a11]
    wire 'UNO.D13', 'b10'
    expect_current 'R1', 0.0..0.02
  no_offense: |
    board :half
    supply :P, voltage: 5, plus: 'B+1', minus: 'B-1'
    resistor :R1, '330', pins: %w[a10 a11]
    wire 'b10', 'B+2'
    wire 'b11', 'B-2'
    expect_current 'R1', 0.01..0.02
Style/WireColor:
  offense: |
    board :half
    supply :P, voltage: 5, plus: 'B+1', minus: 'B-1'
    wire 'a10', 'B+2', color: :blue
  no_offense: |
    board :half
    supply :P, voltage: 5, plus: 'B+1', minus: 'B-1'
    wire 'a10', 'B+2', color: :red
