name: Breadkit Lint
description: Check breadboard circuits and publish SARIF or pull request annotations
inputs:
  path:
    description: Circuit file or directory to inspect
    required: true
  upload-sarif:
    description: Upload results to GitHub code scanning (requires security-events write)
    default: "true"
  fail-level:
    description: Lowest finding severity that fails the job (error, warning, or info)
    default: warning
  annotated-image:
    description: Render an annotated PNG for one circuit file (requires a PNG backend)
    default: "false"
outputs:
  sarif-file:
    description: Generated SARIF file path when upload-sarif is true
    value: ${{ steps.lint.outputs['sarif-file'] }}
  image-file:
    description: Generated annotated PNG path when annotated-image is true
    value: ${{ steps.lint.outputs['image-file'] }}
runs:
  using: composite
  steps:
    - uses: ruby/setup-ruby@26e5b7d197ebf60545ee9667bcbace0be11ccaec # v1.334.0
      with:
        ruby-version: "3.4"
    - id: lint
      name: Check circuits
      shell: bash
      env:
        INPUT_PATH: ${{ inputs.path }}
        INPUT_UPLOAD_SARIF: ${{ inputs['upload-sarif'] }}
        INPUT_FAIL_LEVEL: ${{ inputs['fail-level'] }}
        INPUT_ANNOTATED_IMAGE: ${{ inputs['annotated-image'] }}
      run: bash "$GITHUB_ACTION_PATH/scripts/action-run.sh"
    - name: Upload annotated image
      if: ${{ inputs['annotated-image'] == 'true' && steps.lint.outputs['image-file'] != '' }}
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: breadkit-annotated
        path: ${{ steps.lint.outputs['image-file'] }}
        if-no-files-found: error
        include-hidden-files: true
        retention-days: 1
    - name: Upload SARIF
      if: ${{ inputs['upload-sarif'] == 'true' && steps.lint.outputs['sarif-file'] != '' }}
      uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
      with:
        sarif_file: ${{ steps.lint.outputs['sarif-file'] }}
        category: breadkit-lint
    - name: Fail on findings
      if: ${{ steps.lint.outputs['exit-code'] != '0' }}
      shell: bash
      env:
        BKLINT_EXIT_CODE: ${{ steps.lint.outputs['exit-code'] }}
      run: exit "$BKLINT_EXIT_CODE"
