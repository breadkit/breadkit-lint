rules:
  Layout/InvalidHole: 選択したボードに存在しない穴です。
  Layout/UnknownBoard: 指定したボード定義が見つかりません。
  Layout/UnknownPart: パーツ定義が見つかりません。
  Layout/UnknownTransistorModel: トランジスタの型番が不明なため汎用ピン配置を使用します。
  Layout/UnknownPin: 指定した部品ピンが存在しません。
  Layout/UnknownOption: 指定した部品オプションが存在しません。
  Layout/UnplacedPin: 部品ピンがボードの穴に配置されていません。
  Layout/DuplicateRef: 部品記号またはワイヤ ID が重複しています。
  Layout/InvalidPlacement: 部品の配置がボードに収まりません。
  Layout/HoleConflict: 同じ穴に複数のリードが挿されています。
  Layout/NoFreeHole: 自動配置できる空き穴がありません。
  Layout/SplitNetLabel: 同じラベルが接続されていない複数のネットに付いています。
  Layout/PinsInSameStrip: 同じ部品の複数ピンが同一ストリップに接続しています。
  Electrical/ShortCircuit: 電源間の電位に矛盾があります。
  Electrical/ShortedComponent: 2端子部品が迂回されています。
  Electrical/FloatingPin: 部品ピンが外部に接続されていません。
  Electrical/DanglingWire: ワイヤの端が他の要素に接続されていません。
  Electrical/SplitRail: 分断された電源レールの一部に電源がありません。
  Electrical/MissingSeriesResistor: LED に電流制限抵抗がありません。
  Electrical/ReversePolarity: 有極性部品が逆向きに接続されています。
  Electrical/PowerPinUnconnected: IC の電源ピンまたは GND ピンが電源につながっていません。
  Electrical/SupplyVoltageRange: IC の電源電圧が定格範囲外です。
  Electrical/NoCommonGround: 複数の電源で GND が共通化されていません。
  Electrical/NetLabelConflict: 同じネットに異なる名前が付いています。
  Intent/ConnectionMismatch: 宣言した接続と実際の配線が異なります。
  Intent/UnknownNet: 宣言で参照したネットが見つかりません。
  Style/WireColor: 電源レールの慣例とワイヤ色が異なります。
messages:
  diagnostic_invalid_hole: "無効な穴または接続先です: %{target}"
  diagnostic_unknown_board: "ボード定義が見つかりません。"
  diagnostic_unknown_part: "部品定義が見つかりません: %{target}"
  diagnostic_unknown_transistor_model: "トランジスタの型番が不明なため汎用 EBC ピン配置を使用します: %{target}"
  diagnostic_unknown_pin: "ピンが見つかりません: %{target}"
  diagnostic_unknown_option: "部品オプションが見つかりません: %{option}"
  diagnostic_unplaced_pin: "部品ピンが穴に配置されていません: %{target}"
  diagnostic_duplicate_ref: "識別子が重複しています: %{target}"
  diagnostic_invalid_placement: "部品の配置が無効です: %{target}"
  diagnostic_hole_conflict: "同じ穴に複数の端子があります: %{target}"
  diagnostic_no_free_hole: "空き穴がありません: %{target}"
  diagnostic_split_net_label: "同じラベルが切断されたネットにあります: %{target}"
  diagnostic_unknown_net: "ネットが見つかりません: %{target}"
  rule_error: "%{rule} の検査中にエラーが発生しました: %{error}"
  same_strip: "%{ref} のピン %{left} と %{right} は同じストリップ %{strip} にあります"
  short_circuit: "%{first}（%{first_voltage} V）と %{second}（%{second_voltage} V）の電位がネット %{net} で矛盾します（経路: %{path}）"
  shorted_component: "%{ref} の両端が同じネットに接続されています"
  unplaced_pin: "%{pin} がボードの穴に配置されていません"
  floating_pin: "%{pin} が外部に接続されていません"
  dangling_wire: "%{wire} の端が接続されていません"
  split_rail: "%{rail} の使用中の区間に電源がありません"
  missing_series_resistor: "%{ref} に直列の電流制限抵抗がありません"
  reverse_polarity: "%{ref} の正極の電位が負極より低くなっています"
  power_pin: "%{pin} が有効な電源に接続されていません"
  supply_range: "%{ref} の %{power}/%{ground} 間は %{voltage} V です（定格 %{minimum}〜%{maximum} V）"
  common_ground: "複数の電源で GND が共通化されていません"
  wire_color: "%{wire} の色 %{color} は想定色 %{expected} と異なります"
  label_conflict: "同じネットに異なるラベルがあります: %{labels}"
  unknown_expectation: "接続宣言に不明な参照があります: %{refs}"
  expected_connected: "%{refs} は接続されている必要があります"
  expected_isolated: "%{refs} は分離されている必要があります"
  undeclared_pins: "宣言したネットに未宣言のピンがあります: %{pins}"
  expected_net_name: "ネット名は %{expected} のはずですが %{actual} です"
  expected_one_net: "%{refs} は同じネットにある必要があります"
  unknown_disable: "lint_disable に不明なルールがあります: %{rule}"
  disable_reason: "%{rule} の lint_disable には理由が必要です"
