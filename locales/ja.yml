rules:
  Layout/InvalidHole: 選択したボードに存在しない穴です。
  Layout/UnknownBoard: 指定したボード定義が見つかりません。
  Layout/UnknownPart: パーツ定義が見つかりません。
  Layout/UnknownTransistorModel: トランジスタの型番が不明なため汎用ピン配置を使用します。
  Layout/UnknownPin: 指定した部品ピンが存在しません。
  Layout/UnknownSupplySource: 指定した電源元は電源出力として定義されていません。
  Layout/AmbiguousSupplySource: 指定した電源元に複数の電源出力が一致します。
  Layout/UnknownOption: 指定した部品オプションが存在しません。
  Layout/InvalidOption: 部品オプションの値が無効です。
  Layout/InvalidValue: 部品の値が無効です。
  Layout/InvalidColor: 部品またはワイヤの色が無効です。
  Layout/InvalidRoute: ワイヤの経路指定が無効です。
  Layout/InvalidWireId: ワイヤ ID が穴の名前と衝突しています。
  Layout/UnmatchedParts: 部品定義の指定に一致するファイルがありません。
  Layout/PartOverride: カスタム部品が組み込み部品を上書きしました。
  Lint/RedundantDisable: lint_disable が指摘を抑制していません。
  Lint/UnknownRuleInDisable: lint_disable に不明なルール名があります。
  Layout/UnplacedPin: 部品ピンがボードの穴に配置されていません。
  Layout/DuplicateRef: 部品記号またはワイヤ ID が重複しています。
  Layout/InvalidPlacement: 部品の配置がボードに収まりません。
  Layout/HoleConflict: 同じ穴に複数のリードが挿されています。
  Layout/HoleCovered: モジュール本体の下に別の端子やワイヤがあります。
  Layout/BodyOverlap: 部品の本体同士が重なっています。
  Layout/NoFreeHole: 自動配置できる空き穴がありません。
  Layout/SplitNetLabel: 同じラベルが接続されていない複数のネットに付いています。
  Layout/PinsInSameStrip: 同じ部品の複数ピンが同一ストリップに接続しています。
  Electrical/ShortCircuit: 電源間の電位に矛盾があります。
  Electrical/ShortedComponent: 2端子部品が迂回されています。
  Electrical/FloatingPin: 部品ピンが外部に接続されていません。
  Electrical/DanglingWire: ワイヤの端が他の要素に接続されていません。
  Electrical/SplitRail: 分断された電源レールの一部に電源がありません。
  Electrical/MissingSeriesResistor: LED に電流制限抵抗がありません。
  Electrical/MinimumResistance: LED の電流制限に使う可変抵抗が 0 Ω になり得ます。
  Electrical/ReversePolarity: 有極性部品が逆向きに接続されています。
  Electrical/PowerPinUnconnected: IC の電源ピンまたは GND ピンが電源につながっていません。
  Electrical/SupplyVoltageRange: IC の電源電圧が定格範囲外です。
  Electrical/NoCommonGround: 複数の電源で GND が共通化されていません。
  Electrical/VoltageDomainMismatch: 信号の電圧がピンの許容範囲を超えています。
  Electrical/I2CAddressConflict: 同じ I2C バス上でアドレスが重複しています。
  Electrical/I2CPullupMissing: I2C バスの信号線にプルアップ抵抗がありません。
  Electrical/MissingDecouplingCapacitor: IC の電源ピン間にデカップリングコンデンサがありません。
  Electrical/MissingBaseResistor: 出力ピンとトランジスタのベース間に直列抵抗がありません。
  Electrical/SupplyOverload: 電源の供給電流が指定した上限を超えています。
  Electrical/NetLabelConflict: 同じネットに異なる名前が付いています。
  Intent/ConnectionMismatch: 宣言した接続と実際の配線が異なります。
  Intent/UnknownNet: 宣言で参照したネットが見つかりません。
  Intent/MeasurementUnavailable: 指定した直流電圧または電流を計算できません。
  Style/WireColor: 電源レールの慣例とワイヤ色が異なります。
guidance:
  Lint/RedundantDisable: lint_disable の対象とルール名を確認し、使われていない指定を削除してください。
  Lint/UnknownRuleInDisable: bklint --list-rules でルール名を確認してください。不明な名前では指摘を抑制できません。
  Layout/InvalidHole: 指定したボードに存在する穴 ID を使用してください。
  Layout/UnknownBoard: board で使用可能なボード名を指定するか、use_boards で定義を読み込んでください。
  Layout/UnknownPart: 部品名を確認するか、use_parts で定義を読み込んでください。
  Layout/UnknownTransistorModel: 型番別のピン配置を定義するか、実物のピン配置を確認してください。
  Layout/UnknownPin: 部品定義にあるピン名または番号を指定してください。
  Layout/UnknownOption: 部品定義にある属性名を指定してください。
  Layout/InvalidOption: 属性に許可された値を指定してください。
  Layout/InvalidValue: 抵抗やコンデンサの値を有効な単位表記で指定してください。
  Layout/InvalidColor: CSS の色名、16進色、rgb()、hsl() のいずれかを指定してください。
  Layout/InvalidRoute: 対応しているワイヤ経路を指定してください。
  Layout/InvalidWireId: 穴 ID と紛らわしくないワイヤ ID を指定してください。
  Layout/UnmatchedParts: use_parts のパスとファイル名を確認してください。
  Layout/PartOverride: 上書きした部品のピン配置と属性を確認してください。
  Layout/UnplacedPin: 必要なピンをボードの穴に配置してください。
  Layout/DuplicateRef: 部品、ワイヤ、電源に固有の ID を指定してください。
  Layout/InvalidPlacement: 部品のフットプリントと中央の溝を確認してください。
  Layout/HoleConflict: 1つの穴に挿すリードを1本にしてください。
  Layout/HoleCovered: モジュールの外側にある穴へ端子やワイヤを移してください。
  Layout/BodyOverlap: 部品本体が重ならないように配置を変えてください。
  Layout/NoFreeHole: 同じストリップまたはレールの空き穴を使用してください。
  Layout/SplitNetLabel: 同じラベルを付けたネットをワイヤで接続してください。
  Layout/PinsInSameStrip: 同じ部品のピンを別の導通ストリップに配置してください。
  Electrical/ShortCircuit: 短絡経路に示されたワイヤと電源端子を確認してください。
  Electrical/ShortedComponent: 部品の両端が別々のネットにつながるように配置してください。
  Electrical/FloatingPin: 使用するピンを接続し、未使用なら unused で明示してください。
  Electrical/DanglingWire: ワイヤの両端を部品、電源、または別のワイヤにつないでください。
  Electrical/SplitRail: 表示された2つの穴をワイヤで橋渡ししてください。
  Electrical/MissingSeriesResistor: LED と電源または GPIO の間に電流制限抵抗を直列に入れてください。
  Electrical/MinimumResistance: LED と可変抵抗をつなぐ経路に固定抵抗を直列に入れてください。
  Electrical/ReversePolarity: "部品の極性と電位を確認してください。意図的な逆バイアスは bias: :reverse と明示できます。"
  Electrical/PowerPinUnconnected: 電源ピンと GND ピンを対応する電源ネットに接続してください。
  Electrical/SupplyVoltageRange: IC の電源電圧を部品定義の定格範囲内にしてください。
  Electrical/NoCommonGround: 電源の基準が必要な回路では GND を共有してください。
  Electrical/VoltageDomainMismatch: ピンの最大許容電圧を確認し、レベルシフタや分圧で信号を下げてください。
  Electrical/I2CAddressConflict: 一方のモジュールの ADR 設定を変更するか、別の I2C バスにつないでください。
  Electrical/SupplyOverload: 電源の許容電流を確認し、負荷を減らすか適切な電源を使用してください。
  Electrical/NetLabelConflict: 同じネットに付いた異なるラベルを確認してください。
  Intent/ConnectionMismatch: expect の接続宣言と実際のワイヤ、ネットラベルを一致させてください。
  Intent/UnknownNet: expect で参照したネット名またはピン名を確認してください。
  Style/WireColor: 正極には赤や橙、GND には黒や青など慣例に合う色を指定してください。
