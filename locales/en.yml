rules:
  Layout/InvalidHole: A hole does not exist on the selected board.
  Layout/UnknownBoard: The selected board definition is not available.
  Layout/UnknownPart: The part definition is not available.
  Layout/UnknownTransistorModel: The transistor model is unknown and a generic pinout is used.
  Layout/UnknownPin: A component pin reference does not exist.
  Layout/UnknownSupplySource: The selected source is not a provided power output.
  Layout/AmbiguousSupplySource: The selected source matches multiple provided power outputs.
  Layout/UnknownOption: A component option is not recognized.
  Layout/InvalidOption: A component option value is invalid.
  Layout/InvalidValue: A component value is invalid.
  Layout/InvalidColor: A component or wire color is invalid.
  Layout/InvalidRoute: A wire route is invalid.
  Layout/InvalidWireId: A wire ID conflicts with a board hole.
  Layout/UnmatchedParts: A part glob matches no files.
  Layout/PartOverride: A custom part overrides a built-in part.
  Lint/RedundantDisable: A lint_disable matches no offense.
  Layout/UnplacedPin: A component pin has no board hole.
  Layout/DuplicateRef: A component or wire identifier is repeated.
  Layout/InvalidPlacement: A component footprint does not fit the board.
  Layout/HoleConflict: More than one lead occupies the same hole.
  Layout/HoleCovered: A module body covers another lead or wire endpoint.
  Layout/BodyOverlap: Two component bodies overlap.
  Layout/NoFreeHole: Automatic placement could not find a free hole.
  Layout/SplitNetLabel: A label names disconnected nets.
  Layout/PinsInSameStrip: Two pins of one component share a conductive strip.
  Electrical/ShortCircuit: Power constraints produce inconsistent voltages.
  Electrical/ShortedComponent: A two-pin component is bypassed.
  Electrical/FloatingPin: A component pin has no external connection.
  Electrical/DanglingWire: A wire end has no other connection.
  Electrical/SplitRail: A used segment of a split rail has no supply.
  Electrical/MissingSeriesResistor: An LED has an unprotected path across a supply.
  Electrical/MinimumResistance: A potentiometer can reach zero resistance in an LED current path.
  Electrical/ReversePolarity: A polarized part is connected backwards.
  Electrical/PowerPinUnconnected: An IC power or ground pin is not connected to a supply.
  Electrical/SupplyVoltageRange: An IC supply voltage is outside its rated range.
  Electrical/NoCommonGround: Power supplies do not share a ground.
  Electrical/VoltageDomainMismatch: A signal exceeds a pin's voltage limit.
  Electrical/I2CAddressConflict: I2C devices on one bus use the same address.
  Electrical/I2CPullupMissing: An I2C bus line has no modeled pull-up resistor.
  Electrical/MissingDecouplingCapacitor: A powered IC has no modeled capacitor across its supply pins.
  Electrical/MissingBaseResistor: A declared output drives a transistor base without a series resistor.
  Electrical/SupplyOverload: A modeled load exceeds its supply current limit.
  Electrical/NetLabelConflict: Different labels name one net.
  Intent/ConnectionMismatch: Wiring differs from declared expectations.
  Intent/UnknownNet: An expectation refers to an unknown net.
  Intent/MeasurementUnavailable: A requested DC value cannot be calculated.
  Style/WireColor: A wire color differs from the supply color convention.
